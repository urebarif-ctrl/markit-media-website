<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/></pattern></defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- Dress Form / Mannequin -->
  <path d="M220 120 Q180 120 170 160 Q160 200 180 230 L180 400 Q180 420 200 420 L280 420 Q300 420 300 400 L300 230 Q320 200 310 160 Q300 120 260 120" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="220" y1="120" x2="260" y2="120" stroke="#000" stroke-width="2"/>
  <!-- Waist -->
  <path d="M185 270 Q240 290 295 270" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Stand -->
  <line x1="240" y1="420" x2="240" y2="490" stroke="#000" stroke-width="3"/>
  <ellipse cx="240" cy="500" rx="50" ry="10" fill="none" stroke="#000" stroke-width="2.5"/>
  <!-- Hanger -->
  <circle cx="540" cy="130" r="10" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="540" y1="140" x2="540" y2="160" stroke="#000" stroke-width="2.5"/>
  <polyline points="470,210 540,160 610,210" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="470" y1="210" x2="475" y2="230" stroke="#000" stroke-width="2"/>
  <line x1="610" y1="210" x2="605" y2="230" stroke="#000" stroke-width="2"/>
  <!-- Scissors -->
  <g transform="translate(580,380)">
    <ellipse cx="-30" cy="20" rx="18" ry="25" fill="none" stroke="#000" stroke-width="2.5" transform="rotate(-15)"/>
    <ellipse cx="30" cy="20" rx="18" ry="25" fill="none" stroke="#000" stroke-width="2.5" transform="rotate(15)"/>
    <line x1="-15" y1="-5" x2="15" y2="-80" stroke="#000" stroke-width="2.5"/>
    <line x1="15" y1="-5" x2="-15" y2="-80" stroke="#000" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="5" fill="#000"/>
  </g>
  <!-- Thread Spool -->
  <ellipse cx="160" cy="540" rx="30" ry="10" fill="none" stroke="#000" stroke-width="2"/>
  <ellipse cx="160" cy="520" rx="30" ry="10" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="130" y1="520" x2="130" y2="540" stroke="#000" stroke-width="2"/>
  <line x1="190" y1="520" x2="190" y2="540" stroke="#000" stroke-width="2"/>
  <ellipse cx="160" cy="530" rx="12" ry="6" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Thread line -->
  <path d="M190 530 Q250 530 280 510 Q320 485 360 500" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Needle -->
  <line x1="360" y1="500" x2="390" y2="488" stroke="#000" stroke-width="2"/>
  <circle cx="395" cy="486" r="3" fill="none" stroke="#000" stroke-width="1.5"/>
</svg>