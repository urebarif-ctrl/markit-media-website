<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/></pattern></defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- House -->
  <polygon points="300,120 180,220 420,220" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="200" y="220" width="200" height="160" fill="none" stroke="#000" stroke-width="2.5"/>
  <rect x="270" y="300" width="60" height="80" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="320" cy="345" r="4" fill="#000"/>
  <!-- Chimney -->
  <rect x="350" y="145" width="30" height="55" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Window -->
  <rect x="215" y="245" width="40" height="35" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="235" y1="245" x2="235" y2="280" stroke="#000" stroke-width="1.5"/>
  <line x1="215" y1="262" x2="255" y2="262" stroke="#000" stroke-width="1.5"/>
  <!-- Wrench -->
  <g transform="translate(520,130) rotate(25)">
    <rect x="-5" y="0" width="10" height="80" fill="#000" rx="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#000" stroke-width="6"/>
    <rect x="-10" y="-5" width="20" height="15" fill="#fff"/>
  </g>
  <!-- Hammer -->
  <g transform="translate(620,160) rotate(-15)">
    <rect x="-4" y="0" width="8" height="90" fill="#000" rx="1"/>
    <rect x="-25" y="-15" width="50" height="18" rx="3" fill="#000"/>
  </g>
  <!-- HVAC Ducts -->
  <rect x="480" y="360" width="220" height="40" rx="8" fill="none" stroke="#000" stroke-width="2.5"/>
  <rect x="560" y="400" width="40" height="60" rx="4" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="620" y="400" width="40" height="40" rx="4" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Duct lines -->
  <line x1="490" y1="372" x2="690" y2="372" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="490" y1="388" x2="690" y2="388" stroke="#000" stroke-width="1" opacity="0.3"/>
  <!-- Leaf -->
  <path d="M150 440 Q150 500 200 520 Q250 500 250 440 Q200 460 150 440Z" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M200 520 Q190 480 170 455" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="520" x2="200" y2="560" stroke="#000" stroke-width="2"/>
  <!-- Leaf veins -->
  <line x1="185" y1="490" x2="170" y2="475" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="210" y1="485" x2="230" y2="470" stroke="#000" stroke-width="1" opacity="0.3"/>
</svg>