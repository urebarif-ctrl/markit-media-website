<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
<rect width="800" height="600" fill="white"/>
<!-- Dot grid background -->
<g opacity="0.06"><pattern id="d" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.5" fill="black"/></pattern><rect width="800" height="600" fill="url(#d)"/></g>
<!-- Globe -->
<circle cx="400" cy="300" r="150" fill="none" stroke="black" stroke-width="3"/>
<ellipse cx="400" cy="300" rx="60" ry="150" fill="none" stroke="black" stroke-width="1.5"/>
<line x1="250" y1="300" x2="550" y2="300" stroke="black" stroke-width="1.5"/>
<ellipse cx="400" cy="230" rx="120" ry="20" fill="none" stroke="black" stroke-width="1"/>
<ellipse cx="400" cy="370" rx="120" ry="20" fill="none" stroke="black" stroke-width="1"/>
<!-- Plane -->
<g transform="translate(520,160) rotate(30)">
<path d="M0,0 L60,-15 L70,0 L60,15 Z" fill="none" stroke="black" stroke-width="2"/>
<path d="M25,-15 L35,-45 L45,-15" fill="none" stroke="black" stroke-width="2"/>
<path d="M50,0 L55,20 L60,0" fill="none" stroke="black" stroke-width="1.5"/>
</g>
<!-- Location pins -->
<g fill="black" opacity="0.3">
<circle cx="360" cy="260" r="5"/>
<circle cx="440" cy="310" r="5"/>
<circle cx="380" cy="360" r="5"/>
</g>
<!-- Dotted flight path -->
<path d="M360,260 Q500,200 560,180" fill="none" stroke="black" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.3"/>
</svg>
