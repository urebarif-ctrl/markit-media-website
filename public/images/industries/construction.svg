<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
<rect width="800" height="600" fill="white"/>
<!-- Dot grid background -->
<g opacity="0.06"><pattern id="d" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.5" fill="black"/></pattern><rect width="800" height="600" fill="url(#d)"/></g>
<!-- House frame -->
<polygon points="400,120 250,250 550,250" fill="none" stroke="black" stroke-width="3"/>
<rect x="270" y="250" width="260" height="200" fill="none" stroke="black" stroke-width="3"/>
<!-- Windows -->
<g stroke="black" stroke-width="1.5" fill="none">
<rect x="300" y="280" width="50" height="50"/>
<line x1="325" y1="280" x2="325" y2="330"/>
<line x1="300" y1="305" x2="350" y2="305"/>
<rect x="450" y="280" width="50" height="50"/>
<line x1="475" y1="280" x2="475" y2="330"/>
<line x1="450" y1="305" x2="500" y2="305"/>
</g>
<!-- Door -->
<rect x="375" y="370" width="50" height="80" fill="none" stroke="black" stroke-width="2"/>
<circle cx="415" cy="410" r="3" fill="black"/>
<!-- Crane -->
<g stroke="black" stroke-width="2" fill="none">
<line x1="620" y1="480" x2="620" y2="140"/>
<line x1="600" y1="480" x2="640" y2="480"/>
<line x1="620" y1="140" x2="720" y2="140"/>
<line x1="620" y1="140" x2="580" y2="140"/>
<line x1="620" y1="140" x2="720" y2="160"/>
<line x1="720" y1="140" x2="720" y2="180"/>
</g>
<!-- Bricks pattern -->
<g stroke="black" stroke-width="1" opacity="0.2">
<rect x="150" y="420" width="40" height="20"/>
<rect x="170" y="440" width="40" height="20"/>
<rect x="150" y="460" width="40" height="20"/>
<rect x="170" y="480" width="40" height="20"/>
</g>
</svg>
