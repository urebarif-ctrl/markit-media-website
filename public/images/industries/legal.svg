<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/></pattern></defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <!-- Scales of Justice -->
  <line x1="400" y1="120" x2="400" y2="340" stroke="#000" stroke-width="4"/>
  <line x1="280" y1="180" x2="520" y2="180" stroke="#000" stroke-width="4"/>
  <circle cx="400" cy="120" r="12" fill="#000"/>
  <!-- Left pan -->
  <line x1="280" y1="180" x2="280" y2="260" stroke="#000" stroke-width="2"/>
  <path d="M230 260 Q255 300 280 260 Q305 300 330 260" stroke="#000" stroke-width="2" fill="none"/>
  <!-- Right pan -->
  <line x1="520" y1="180" x2="520" y2="240" stroke="#000" stroke-width="2"/>
  <path d="M470 240 Q495 280 520 240 Q545 280 570 240" stroke="#000" stroke-width="2" fill="none"/>
  <!-- Base -->
  <rect x="370" y="340" width="60" height="10" fill="#000"/>
  <rect x="350" y="350" width="100" height="8" fill="#000"/>
  <!-- Gavel -->
  <rect x="580" y="300" width="80" height="30" rx="5" fill="#000"/>
  <rect x="615" y="330" width="10" height="60" fill="#000"/>
  <!-- Column -->
  <rect x="100" y="200" width="60" height="200" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="90" y="190" width="80" height="15" fill="#000"/>
  <rect x="90" y="395" width="80" height="15" fill="#000"/>
  <line x1="115" y1="215" x2="115" y2="395" stroke="#000" stroke-width="2"/>
  <line x1="130" y1="215" x2="130" y2="395" stroke="#000" stroke-width="2"/>
  <line x1="145" y1="215" x2="145" y2="395" stroke="#000" stroke-width="2"/>
  <!-- Document -->
  <rect x="600" y="420" width="100" height="130" fill="none" stroke="#000" stroke-width="2"/>
  <line x1="620" y1="445" x2="680" y2="445" stroke="#000" stroke-width="1.5"/>
  <line x1="620" y1="460" x2="680" y2="460" stroke="#000" stroke-width="1.5"/>
  <line x1="620" y1="475" x2="660" y2="475" stroke="#000" stroke-width="1.5"/>
  <circle cx="650" cy="520" r="15" fill="none" stroke="#000" stroke-width="2"/>
  <text x="650" y="525" text-anchor="middle" font-size="12" fill="#000" font-family="serif">§</text>
</svg>
