  <line x1="120" y1="180" x2="120" y2="440" stroke="#000" stroke-width="2.5"/>
  <line x1="120" y1="180" x2="108" y2="240" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="180" x2="120" y2="240" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="180" x2="132" y2="240" stroke="#000" stroke-width="2"/>
  <line x1="108" y1="240" x2="132" y2="240" stroke="#000" stroke-width="2"/>
  <!-- Knife (right of plate) -->
  <line x1="480" y1="180" x2="480" y2="440" stroke="#000" stroke-width="2.5"/>
  <path d="M480 180 Q500 220 480 260" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Chef Hat -->
  <path d="M560 220 Q560 160 600 140 Q640 120 670 140 Q710 120 740 140 Q780 160 780 220" fill="none" stroke="#000" stroke-width="2.5"/>
  <rect x="575" y="220" width="190" height="60" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="575" y1="240" x2="765" y2="240" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Hat pleat lines -->
  <line x1="620" y1="160" x2="620" y2="220" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="670" y1="145" x2="670" y2="220" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="720" y1="160" x2="720" y2="220" stroke="#000" stroke-width="1" opacity="0.15"/>
  <!-- Steaming Cup -->
  <rect x="580" y="380" width="100" height="90" rx="4" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M680 400 Q720 400 720 430 Q720 460 680 460" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="570" y="470" width="120" height="8" rx="4" fill="#000"/>
  <!-- Steam -->
  <path d="M600 370 Q605 355 600 340" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <path d="M625 365 Q630 348 625 332" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <path d="M650 370 Q655 355 650 340" fill="none" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Napkin accent -->
  <path d="M100 500 L180 500 L140 560Z" fill="none" stroke="#000" stroke-width="1.5" opacity="0.2"/>
</svg>