<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#fff"/>
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- Graduation cap -->
  <polygon points="400,140 520,200 400,260 280,200" fill="#000"/>
  <rect x="390" y="120" width="20" height="30" fill="#000"/>
  <line x1="520" y1="200" x2="520" y2="270" stroke="#000" stroke-width="2"/>
  <circle cx="520" cy="275" r="5" fill="#000"/>
  <rect x="370" y="255" width="60" height="8" fill="#000"/>
  <!-- Open book -->
  <path d="M160,320 Q160,300 200,300 L280,300 L280,420 Q240,420 200,430 Q160,440 160,420 Z" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M280,300 L360,300 Q400,300 400,320 L400,420 Q400,440 360,430 Q320,420 280,420 Z" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="190" y1="330" x2="265" y2="330" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="190" y1="350" x2="265" y2="350" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="190" y1="370" x2="255" y2="370" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="295" y1="330" x2="370" y2="330" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="295" y1="350" x2="370" y2="350" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <line x1="295" y1="370" x2="360" y2="370" stroke="#000" stroke-width="1.5" opacity="0.4"/>
  <!-- Pencil -->
  <g transform="translate(560,280) rotate(30)">
    <rect x="0" y="0" width="16" height="120" fill="#000" rx="1"/>
    <polygon points="0,120 16,120 8,145" fill="#000"/>
    <rect x="0" y="0" width="16" height="15" fill="#000" stroke="#fff" stroke-width="1"/>
    <line x1="8" y1="135" x2="8" y2="145" stroke="#fff" stroke-width="1"/>
  </g>
  <!-- Chalkboard -->
  <rect x="120" y="460" width="560" height="120" rx="4" fill="#000"/>
  <rect x="135" y="472" width="530" height="96" rx="2" fill="#fff"/>
  <line x1="160" y1="500" x2="350" y2="500" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="520" x2="420" y2="520" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="160" y1="540" x2="300" y2="540" stroke="#000" stroke-width="2" opacity="0.3"/>
  <!-- Math symbols on board -->
  <text x="500" y="510" font-family="serif" font-size="28" fill="#000" opacity="0.25">x+y</text>
  <text x="490" y="545" font-family="serif" font-size="22" fill="#000" opacity="0.25">=z</text>
</svg>