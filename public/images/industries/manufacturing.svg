<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
<rect width="800" height="600" fill="white"/>
<!-- Dot grid background -->
<g opacity="0.06"><pattern id="d" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1.5" fill="black"/></pattern><rect width="800" height="600" fill="url(#d)"/></g>
<!-- Factory building -->
<rect x="200" y="280" width="400" height="200" fill="none" stroke="black" stroke-width="3"/>
<!-- Roof sawtooth -->
<polygon points="200,280 200,200 350,280" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="350,280 350,200 500,280" fill="none" stroke="black" stroke-width="2.5"/>
<polygon points="500,280 500,200 600,280" fill="none" stroke="black" stroke-width="2.5"/>
<!-- Smokestacks -->
<rect x="250" y="140" width="30" height="140" fill="none" stroke="black" stroke-width="2"/>
<rect x="420" y="120" width="30" height="160" fill="none" stroke="black" stroke-width="2"/>
<!-- Smoke -->
<g stroke="black" stroke-width="1.5" fill="none" opacity="0.2">
<path d="M265,140 Q275,120 265,100 Q255,80 265,60"/>
<path d="M435,120 Q445,100 435,80 Q425,60 435,40"/>
</g>
<!-- Windows -->
<g stroke="black" stroke-width="1.5" fill="none">
<rect x="230" y="320" width="50" height="40"/>
<rect x="310" y="320" width="50" height="40"/>
<rect x="390" y="320" width="50" height="40"/>
<rect x="470" y="320" width="50" height="40"/>
</g>
<!-- Loading dock door -->
<rect x="540" y="400" width="50" height="80" fill="none" stroke="black" stroke-width="2"/>
<g stroke="black" stroke-width="1" opacity="0.3">
<line x1="540" y1="420" x2="590" y2="420"/>
<line x1="540" y1="440" x2="590" y2="440"/>
<line x1="540" y1="460" x2="590" y2="460"/>
</g>
<!-- Gear -->
<g transform="translate(680,300)" stroke="black" stroke-width="2" fill="none" opacity="0.3">
<circle cx="0" cy="0" r="30"/>
<circle cx="0" cy="0" r="12"/>
<line x1="0" y1="-35" x2="0" y2="-25"/>
<line x1="0" y1="25" x2="0" y2="35"/>
<line x1="-35" y1="0" x2="-25" y2="0"/>
<line x1="25" y1="0" x2="35" y2="0"/>
<line x1="-24" y1="-24" x2="-18" y2="-18"/>
<line x1="18" y1="18" x2="24" y2="24"/>
<line x1="-24" y1="24" x2="-18" y2="18"/>
<line x1="18" y1="-18" x2="24" y2="-24"/>
</g>
</svg>
