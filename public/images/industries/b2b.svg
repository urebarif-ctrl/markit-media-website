  <rect x="370" y="270" width="40" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Building -->
  <rect x="520" y="130" width="100" height="200" fill="none" stroke="#000" stroke-width="3"/>
  <rect x="520" y="120" width="100" height="15" fill="#000"/>
