  <rect x="535" y="155" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="570" y="155" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="535" y="195" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="570" y="195" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="535" y="235" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="570" y="235" width="20" height="20" fill="#000" opacity="0.15" stroke="#000" stroke-width="1.5"/>
  <rect x="555" y="285" width="25" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Connected Nodes / Network -->
  <circle cx="180" cy="470" r="15" fill="#000"/>
  <circle cx="300" cy="430" r="15" fill="#000"/>
  <circle cx="260" cy="540" r="15" fill="#000"/>
