  <circle cx="360" cy="530" r="12" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="193" y1="478" x2="287" y2="438" stroke="#000" stroke-width="2"/>
  <line x1="186" y1="484" x2="254" y2="526" stroke="#000" stroke-width="2"/>
  <line x1="274" y1="538" x2="295" y2="445" stroke="#000" stroke-width="2"/>
  <line x1="167" y1="478" x2="128" y2="530" stroke="#000" stroke-width="2"/>
  <line x1="312" y1="440" x2="350" y2="522" stroke="#000" stroke-width="2"/>
  <!-- Briefcase -->
  <rect x="560" y="420" width="140" height="100" rx="6" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="560" y1="455" x2="700" y2="455" stroke="#000" stroke-width="2"/>
  <rect x="605" y="400" width="50" height="25" rx="3" fill="none" stroke="#000" stroke-width="2"/>
