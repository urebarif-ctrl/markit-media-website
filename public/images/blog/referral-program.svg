<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="1" fill="#000" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Central person -->
  <circle cx="600" cy="240" r="50" fill="#000"/>
  <circle cx="600" cy="220" r="16" fill="#fff"/>
  <path d="M575 260Q575 240 600 240Q625 240 625 260" fill="#fff"/>
  <!-- Surrounding people - ring 1 -->
  <!-- Top left -->
  <circle cx="420" cy="180" r="35" fill="#000"/>
  <circle cx="420" cy="168" r="11" fill="#fff"/>
  <path d="M403 192Q403 180 420 180Q437 180 437 192" fill="#fff"/>
  <!-- Top right -->
  <circle cx="780" cy="180" r="35" fill="#000"/>
  <circle cx="780" cy="168" r="11" fill="#fff"/>
  <path d="M763 192Q763 180 780 180Q797 180 797 192" fill="#fff"/>
  <!-- Bottom left -->
  <circle cx="400" cy="380" r="35" fill="#000"/>
  <circle cx="400" cy="368" r="11" fill="#fff"/>
  <path d="M383 392Q383 380 400 380Q417 380 417 392" fill="#fff"/>
  <!-- Bottom right -->
  <circle cx="800" cy="380" r="35" fill="#000"/>
  <circle cx="800" cy="368" r="11" fill="#fff"/>
  <path d="M783 392Q783 380 800 380Q817 380 817 392" fill="#fff"/>
  <!-- Ring 2 - smaller people -->
  <circle cx="260" cy="280" r="24" fill="#000" opacity=".6"/>
  <circle cx="260" cy="272" r="8" fill="#fff"/>
  <circle cx="940" cy="280" r="24" fill="#000" opacity=".6"/>
  <circle cx="940" cy="272" r="8" fill="#fff"/>
  <circle cx="300" cy="480" r="20" fill="#000" opacity=".4"/>
  <circle cx="300" cy="474" r="6" fill="#fff"/>
  <circle cx="900" cy="480" r="20" fill="#000" opacity=".4"/>
  <circle cx="900" cy="474" r="6" fill="#fff"/>
  <!-- Connection lines with arrows -->
  <line x1="555" y1="220" x2="460" y2="190" stroke="#000" stroke-width="2" opacity=".2"/>
  <line x1="645" y1="220" x2="740" y2="190" stroke="#000" stroke-width="2" opacity=".2"/>
  <line x1="565" y1="270" x2="435" y2="360" stroke="#000" stroke-width="2" opacity=".2"/>
  <line x1="635" y1="270" x2="765" y2="360" stroke="#000" stroke-width="2" opacity=".2"/>
  <!-- Secondary connections -->
  <line x1="388" y1="190" x2="290" y2="270" stroke="#000" stroke-width="1.5" opacity=".1"/>
  <line x1="812" y1="190" x2="910" y2="270" stroke="#000" stroke-width="1.5" opacity=".1"/>
  <line x1="380" y1="410" x2="320" y2="465" stroke="#000" stroke-width="1" opacity=".08"/>
  <line x1="820" y1="410" x2="880" y2="465" stroke="#000" stroke-width="1" opacity=".08"/>
  <!-- Share/arrow icons on connections -->
  <g transform="translate(505,205)" opacity=".4">
    <polygon points="0,-6 6,0 0,6 2,0" fill="#000"/>
  </g>
  <g transform="translate(695,205)" opacity=".4">
    <polygon points="0,-6 6,0 0,6 2,0" fill="#000"/>
  </g>
  <!-- Label bar -->
  <rect x="400" y="540" width="400" height="44" rx="22" fill="#000"/>
  <text x="600" y="568" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3">REFERRAL PROGRAM</text>
</svg>