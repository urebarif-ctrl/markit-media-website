<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#000" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Shopping bag -->
  <g transform="translate(380,100)">
    <path d="M40 120L20 350Q18 370 38 370H202Q222 370 220 350L200 120Z" fill="#000"/>
    <!-- Bag handle -->
    <path d="M80 120Q80 50 120 50Q160 50 160 120" fill="none" stroke="#000" stroke-width="6"/>
    <!-- Tag on bag -->
    <circle cx="120" cy="200" r="18" fill="#fff"/>
    <text x="120" y="206" text-anchor="middle" fill="#000" font-family="system-ui,sans-serif" font-size="16" font-weight="700">$</text>
  </g>
  <!-- Instagram-style grid - right side -->
  <g transform="translate(650,80)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="120" height="120" rx="4" fill="#000"/>
    <rect x="130" y="0" width="120" height="120" rx="4" fill="#000" opacity=".7"/>
    <rect x="260" y="0" width="120" height="120" rx="4" fill="#000" opacity=".4"/>
    <!-- Row 2 -->
    <rect x="0" y="130" width="120" height="120" rx="4" fill="#000" opacity=".5"/>
    <rect x="130" y="130" width="120" height="120" rx="4" fill="#000" opacity=".85"/>
    <rect x="260" y="130" width="120" height="120" rx="4" fill="#000" opacity=".3"/>
    <!-- Row 3 -->
    <rect x="0" y="260" width="120" height="120" rx="4" fill="#000" opacity=".3"/>
    <rect x="130" y="260" width="120" height="120" rx="4" fill="#000" opacity=".55"/>
    <rect x="260" y="260" width="120" height="120" rx="4" fill="#000" opacity=".75"/>
    <!-- Shopping bag icons on grid items -->
    <g fill="#fff" opacity=".5">
      <path d="M50 45L42 65H58L50 45ZM46 45Q46 40 50 40Q54 40 54 45" transform="translate(0,0)"/>
      <path d="M50 45L42 65H58L50 45ZM46 45Q46 40 50 40Q54 40 54 45" transform="translate(130,130)"/>
      <path d="M50 45L42 65H58L50 45ZM46 45Q46 40 50 40Q54 40 54 45" transform="translate(260,260)"/>
    </g>
  </g>
  <!-- Connection dots between bag and grid -->
  <circle cx="620" cy="200" r="3" fill="#000" opacity=".2"/>
  <circle cx="635" cy="240" r="3" fill="#000" opacity=".2"/>
  <circle cx="625" cy="320" r="3" fill="#000" opacity=".2"/>
  <!-- Label bar -->
  <rect x="370" y="540" width="460" height="44" rx="22" fill="#000"/>
  <text x="600" y="568" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3">INSTAGRAM SHOPPING</text>
</svg>