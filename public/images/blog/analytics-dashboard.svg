  <rect x="810" y="150" width="60" height="8" rx="4" fill="#000" opacity=".3"/>
  <text x="810" y="195" fill="#000" font-family="system-ui,sans-serif" font-size="28" font-weight="700">$12.4K</text>
  <!-- Line chart -->
  <rect x="370" y="245" width="400" height="200" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
