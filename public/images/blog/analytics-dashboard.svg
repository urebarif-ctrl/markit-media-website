  <rect x="790" y="245" width="200" height="200" rx="8" fill="none" stroke="#000" stroke-width="1.5"/>
  <rect x="815" y="360" width="25" height="70" fill="#000"/>
  <rect x="850" y="330" width="25" height="100" fill="#000" opacity=".7"/>
  <rect x="885" y="300" width="25" height="130" fill="#000" opacity=".5"/>
  <rect x="920" y="280" width="25" height="150" fill="#000" opacity=".8"/>
  <rect x="955" y="310" width="25" height="120" fill="#000" opacity=".6"/>
  <!-- Data table rows -->
