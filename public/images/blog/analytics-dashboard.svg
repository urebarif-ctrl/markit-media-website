<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#000" stroke-width=".3" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Dashboard frame -->
  <rect x="180" y="60" width="840" height="480" rx="12" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="180" y1="110" x2="1020" y2="110" stroke="#000" stroke-width="2"/>
  <!-- Window dots -->
  <circle cx="210" cy="85" r="6" fill="#000"/>
  <circle cx="232" cy="85" r="6" fill="#000" opacity=".4"/>
  <circle cx="254" cy="85" r="6" fill="#000" opacity=".2"/>
