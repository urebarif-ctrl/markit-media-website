<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#000" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Microphone -->
  <g transform="translate(460,260)">
    <rect x="-30" y="-80" width="60" height="110" rx="30" fill="#000"/>
    <!-- Mic grille lines -->
    <line x1="-18" y1="-60" x2="18" y2="-60" stroke="#fff" stroke-width="1.5" opacity=".3"/>
    <line x1="-18" y1="-48" x2="18" y2="-48" stroke="#fff" stroke-width="1.5" opacity=".3"/>
    <line x1="-18" y1="-36" x2="18" y2="-36" stroke="#fff" stroke-width="1.5" opacity=".3"/>
    <line x1="-18" y1="-24" x2="18" y2="-24" stroke="#fff" stroke-width="1.5" opacity=".3"/>
    <!-- Mic arc -->
    <path d="M-50 -10Q-50 80 0 80Q50 80 50 -10" fill="none" stroke="#000" stroke-width="4"/>
    <!-- Mic stand -->
    <line x1="0" y1="80" x2="0" y2="140" stroke="#000" stroke-width="4"/>
    <line x1="-30" y1="140" x2="30" y2="140" stroke="#000" stroke-width="4"/>
  </g>
  <!-- Sound waves - right side -->
  <path d="M540 200Q580 260 540 320" fill="none" stroke="#000" stroke-width="3" opacity=".5"/>
  <path d="M570 170Q625 260 570 350" fill="none" stroke="#000" stroke-width="2.5" opacity=".35"/>
  <path d="M600 140Q670 260 600 380" fill="none" stroke="#000" stroke-width="2" opacity=".22"/>
  <path d="M630 115Q710 260 630 405" fill="none" stroke="#000" stroke-width="1.5" opacity=".14"/>
  <!-- Audio waveform bars - right -->
  <g transform="translate(700,160)" opacity=".7">
    <rect x="0" y="60" width="8" height="80" rx="4" fill="#000"/>
    <rect x="18" y="30" width="8" height="140" rx="4" fill="#000"/>
    <rect x="36" y="50" width="8" height="100" rx="4" fill="#000"/>
    <rect x="54" y="15" width="8" height="170" rx="4" fill="#000"/>
    <rect x="72" y="40" width="8" height="120" rx="4" fill="#000"/>
    <rect x="90" y="55" width="8" height="90" rx="4" fill="#000"/>
    <rect x="108" y="25" width="8" height="150" rx="4" fill="#000"/>
    <rect x="126" y="45" width="8" height="110" rx="4" fill="#000"/>
    <rect x="144" y="65" width="8" height="70" rx="4" fill="#000"/>
    <rect x="162" y="35" width="8" height="130" rx="4" fill="#000"/>
    <rect x="180" y="55" width="8" height="90" rx="4" fill="#000"/>
    <rect x="198" y="70" width="8" height="60" rx="4" fill="#000"/>
  </g>
  <!-- Subtle play button -->
  <circle cx="900" cy="260" r="35" fill="#000" opacity=".1"/>
  <polygon points="890,242 890,278 918,260" fill="#000" opacity=".2"/>
  <!-- Label bar -->
  <rect x="380" y="540" width="440" height="44" rx="22" fill="#000"/>
  <text x="600" y="568" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3">PODCAST MARKETING</text>
</svg>