<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#000" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#fff"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <!-- Rising bars -->
  <rect x="320" y="420" width="60" height="80" fill="#000" opacity=".2"/>
  <rect x="410" y="370" width="60" height="130" fill="#000" opacity=".3"/>
  <rect x="500" y="310" width="60" height="190" fill="#000" opacity=".45"/>
  <rect x="590" y="250" width="60" height="250" fill="#000" opacity=".6"/>
  <rect x="680" y="190" width="60" height="310" fill="#000" opacity=".75"/>
  <rect x="770" y="130" width="60" height="370" fill="#000"/>
  <!-- Trend line -->
  <polyline points="350,400 440,350 530,290 620,230 710,170 800,110" fill="none" stroke="#000" stroke-width="2.5" stroke-dasharray="6,4" opacity=".3"/>
  <!-- Dollar signs on bars -->
  <text x="800" y="180" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="20" font-weight="700">$</text>
  <text x="710" y="230" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="18" font-weight="700">$</text>
  <!-- Click cursor -->
  <g transform="translate(860,160)">
    <path d="M0 0L0 50 14 38 24 58 34 54 24 34 42 34Z" fill="#000" stroke="#fff" stroke-width="2"/>
  </g>
  <!-- Click ripple rings -->
  <circle cx="860" cy="160" r="25" fill="none" stroke="#000" stroke-width="1.5" opacity=".15"/>
  <circle cx="860" cy="160" r="45" fill="none" stroke="#000" stroke-width="1" opacity=".1"/>
  <circle cx="860" cy="160" r="65" fill="none" stroke="#000" stroke-width=".8" opacity=".06"/>
  <!-- Axis lines -->
  <line x1="300" y1="500" x2="850" y2="500" stroke="#000" stroke-width="2" opacity=".15"/>
  <line x1="300" y1="130" x2="300" y2="500" stroke="#000" stroke-width="2" opacity=".15"/>
  <!-- CPC / ROI labels -->
  <text x="280" y="320" text-anchor="end" fill="#000" font-family="system-ui,sans-serif" font-size="12" opacity=".3" transform="rotate(-90,280,320)">COST / VALUE</text>
  <!-- Label bar -->
  <rect x="420" y="545" width="360" height="44" rx="22" fill="#000"/>
  <text x="600" y="573" text-anchor="middle" fill="#fff" font-family="system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="3">PPC GUIDE</text>
</svg>