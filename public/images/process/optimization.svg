<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="#000" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- Upward graph -->
  <line x1="200" y1="400" x2="200" y2="160" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="400" x2="500" y2="400" stroke="#000" stroke-width="2"/>
  <!-- Graph line going up -->
  <polyline points="220,370 280,350 340,320 380,270 420,220 470,180" stroke="#000" stroke-width="2.5" fill="none"/>
  <circle cx="220" cy="370" r="4" fill="#000"/>
  <circle cx="280" cy="350" r="4" fill="#000"/>
  <circle cx="340" cy="320" r="4" fill="#000"/>
  <circle cx="380" cy="270" r="4" fill="#000"/>
  <circle cx="420" cy="220" r="4" fill="#000"/>
  <circle cx="470" cy="180" r="4" fill="#000"/>
  <!-- Axis ticks -->
  <line x1="195" y1="350" x2="200" y2="350" stroke="#000" stroke-width="1.5"/>
  <line x1="195" y1="300" x2="200" y2="300" stroke="#000" stroke-width="1.5"/>
  <line x1="195" y1="250" x2="200" y2="250" stroke="#000" stroke-width="1.5"/>
  <line x1="195" y1="200" x2="200" y2="200" stroke="#000" stroke-width="1.5"/>
  <!-- Grid lines -->
  <line x1="200" y1="350" x2="500" y2="350" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <line x1="200" y1="300" x2="500" y2="300" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <line x1="200" y1="250" x2="500" y2="250" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <line x1="200" y1="200" x2="500" y2="200" stroke="#000" stroke-width="0.5" opacity="0.08"/>
  <!-- A/B test frames -->
  <rect x="550" y="170" width="90" height="120" stroke="#000" stroke-width="2" fill="none"/>
  <text x="585" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">A</text>
  <rect x="660" y="170" width="90" height="120" stroke="#000" stroke-width="2" fill="none"/>
  <text x="695" y="160" font-family="sans-serif" font-size="14" font-weight="bold" fill="#000" text-anchor="middle">B</text>
  <!-- Content lines in A -->
  <line x1="565" y1="195" x2="625" y2="195" stroke="#000" stroke-width="1.5" opacity="0.25"/>
  <line x1="565" y1="210" x2="615" y2="210" stroke="#000" stroke-width="1.5" opacity="0.25"/>
  <rect x="565" y="225" width="55" height="45" stroke="#000" stroke-width="1" fill="none" opacity="0.2"/>
  <!-- Content lines in B -->
  <rect x="675" y="190" width="55" height="45" stroke="#000" stroke-width="1" fill="none" opacity="0.2"/>
  <line x1="675" y1="250" x2="735" y2="250" stroke="#000" stroke-width="1.5" opacity="0.25"/>
  <line x1="675" y1="265" x2="725" y2="265" stroke="#000" stroke-width="1.5" opacity="0.25"/>
  <!-- Sliders -->
  <line x1="560" y1="360" x2="740" y2="360" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <circle cx="660" cy="360" r="6" stroke="#000" stroke-width="2" fill="#fff"/>
  <line x1="560" y1="390" x2="740" y2="390" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <circle cx="620" cy="390" r="6" stroke="#000" stroke-width="2" fill="#fff"/>
  <line x1="560" y1="420" x2="740" y2="420" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <circle cx="700" cy="420" r="6" stroke="#000" stroke-width="2" fill="#fff"/>
  <!-- Geometric accents -->
  <polygon points="650,500 670,500 660,480" stroke="#000" stroke-width="1" fill="none" opacity="0.15"/>
  <rect x="160" y="130" width="35" height="35" stroke="#000" stroke-width="1" fill="none" opacity="0.12" transform="rotate(20 177 147)"/>
  <circle cx="500" cy="130" r="15" stroke="#000" stroke-width="1" fill="none" opacity="0.1"/>
</svg>