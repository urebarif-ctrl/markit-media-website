<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="#000" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- Gear 1 (large) -->
  <circle cx="320" cy="260" r="55" stroke="#000" stroke-width="2.5" fill="none"/>
  <circle cx="320" cy="260" r="38" stroke="#000" stroke-width="1.5" fill="none"/>
  <circle cx="320" cy="260" r="8" fill="#000"/>
  <!-- Gear teeth (large) -->
  <rect x="312" y="197" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff"/>
  <rect x="312" y="309" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff"/>
  <rect x="253" y="252" width="14" height="16" stroke="#000" stroke-width="2" fill="#fff"/>
  <rect x="373" y="252" width="14" height="16" stroke="#000" stroke-width="2" fill="#fff"/>
  <rect x="268" y="214" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff" transform="rotate(-45 276 221)"/>
  <rect x="356" y="214" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff" transform="rotate(45 364 221)"/>
  <rect x="268" y="292" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff" transform="rotate(45 276 299)"/>
  <rect x="356" y="292" width="16" height="14" stroke="#000" stroke-width="2" fill="#fff" transform="rotate(-45 364 299)"/>
  <!-- Gear 2 (small) -->
  <circle cx="420" cy="340" r="35" stroke="#000" stroke-width="2" fill="none"/>
  <circle cx="420" cy="340" r="22" stroke="#000" stroke-width="1.5" fill="none"/>
  <circle cx="420" cy="340" r="5" fill="#000"/>
  <rect x="413" y="299" width="14" height="10" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <rect x="413" y="371" width="14" height="10" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <rect x="379" y="333" width="10" height="14" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <rect x="451" y="333" width="10" height="14" stroke="#000" stroke-width="1.5" fill="#fff"/>
  <!-- Rocket shape -->
  <path d="M560 350 L580 200 L600 350 Z" stroke="#000" stroke-width="2" fill="none"/>
  <circle cx="580" cy="280" r="10" stroke="#000" stroke-width="1.5" fill="none"/>
  <line x1="560" y1="350" x2="545" y2="375" stroke="#000" stroke-width="2"/>
  <line x1="600" y1="350" x2="615" y2="375" stroke="#000" stroke-width="2"/>
  <!-- Exhaust lines -->
  <line x1="570" y1="365" x2="570" y2="390" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <line x1="580" y1="360" x2="580" y2="400" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <line x1="590" y1="365" x2="590" y2="390" stroke="#000" stroke-width="1.5" opacity="0.3"/>
  <!-- Progress bars -->
  <rect x="180" y="430" width="200" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="180" y="430" width="160" height="8" fill="#000"/>
  <rect x="180" y="455" width="200" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="180" y="455" width="120" height="8" fill="#000"/>
  <rect x="180" y="480" width="200" height="8" stroke="#000" stroke-width="1" fill="none"/>
  <rect x="180" y="480" width="180" height="8" fill="#000"/>
  <!-- Geometric accents -->
  <rect x="620" y="140" width="40" height="40" stroke="#000" stroke-width="1" fill="none" opacity="0.15"/>
  <polygon points="200,140 220,140 210,120" stroke="#000" stroke-width="1" fill="none" opacity="0.15"/>
  <circle cx="650" cy="460" r="18" stroke="#000" stroke-width="1" fill="none" opacity="0.12"/>
</svg>