<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#fff"/>
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="0.8" fill="#000" opacity="0.08"/>
  </pattern>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- Magnifying glass -->
  <circle cx="340" cy="260" r="80" stroke="#000" stroke-width="3" fill="none"/>
  <circle cx="340" cy="260" r="65" stroke="#000" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
  <line x1="396" y1="316" x2="450" y2="370" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <!-- Data points scattered -->
  <circle cx="310" cy="240" r="4" fill="#000"/>
  <circle cx="350" cy="230" r="3" fill="#000"/>
  <circle cx="370" cy="265" r="5" fill="#000"/>
  <circle cx="325" cy="285" r="3.5" fill="#000"/>
  <circle cx="355" cy="275" r="2.5" fill="#000"/>
  <circle cx="320" cy="255" r="3" fill="#000"/>
  <!-- Connection lines between data points -->
  <line x1="310" y1="240" x2="350" y2="230" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="350" y1="230" x2="370" y2="265" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="370" y1="265" x2="355" y2="275" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="325" y1="285" x2="320" y2="255" stroke="#000" stroke-width="1" opacity="0.3"/>
  <line x1="320" y1="255" x2="310" y2="240" stroke="#000" stroke-width="1" opacity="0.3"/>
  <!-- Network nodes outside lens -->
  <circle cx="520" cy="180" r="6" fill="#000"/>
  <circle cx="580" cy="220" r="4" fill="#000"/>
  <circle cx="550" cy="300" r="5" fill="#000"/>
  <circle cx="620" cy="280" r="3" fill="#000"/>
  <circle cx="200" cy="180" r="5" fill="#000"/>
  <circle cx="160" cy="350" r="4" fill="#000"/>
  <circle cx="240" cy="400" r="3" fill="#000"/>
  <!-- Connection lines for network -->
  <line x1="520" y1="180" x2="580" y2="220" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="580" y1="220" x2="550" y2="300" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="550" y1="300" x2="620" y2="280" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="520" y1="180" x2="620" y2="280" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="180" x2="160" y2="350" stroke="#000" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="350" x2="240" y2="400" stroke="#000" stroke-width="1" opacity="0.15"/>
  <!-- Geometric accent shapes -->
  <rect x="500" y="380" width="60" height="60" stroke="#000" stroke-width="1.5" fill="none" transform="rotate(15 530 410)"/>
  <polygon points="180,130 210,130 195,105" stroke="#000" stroke-width="1.5" fill="none"/>
  <rect x="600" y="120" width="40" height="40" stroke="#000" stroke-width="1" fill="none" opacity="0.2"/>
  <circle cx="650" cy="420" r="20" stroke="#000" stroke-width="1" fill="none" opacity="0.15"/>
</svg>