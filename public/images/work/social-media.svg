<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
<rect width="800" height="450" fill="#fff"/>
<pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/>
</pattern>
<rect width="800" height="450" fill="url(#dots)"/>
<!-- Large speech bubble -->
<rect x="140" y="80" width="260" height="160" rx="16" stroke="#000" stroke-width="3" fill="none"/>
<path d="M200,240 L220,280 L250,240" stroke="#000" stroke-width="3" fill="#fff"/>
<!-- Lines in speech bubble -->
<line x1="180" y1="130" x2="350" y2="130" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
<line x1="180" y1="155" x2="330" y2="155" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
<line x1="180" y1="180" x2="300" y2="180" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
<!-- Smaller speech bubble -->
<rect x="340" y="200" width="180" height="110" rx="12" stroke="#000" stroke-width="2.5" fill="none"/>
<path d="M470,310 L480,340 L500,310" stroke="#000" stroke-width="2.5" fill="#fff"/>
<!-- Lines in smaller bubble -->
<line x1="370" y1="240" x2="490" y2="240" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<line x1="370" y1="260" x2="470" y2="260" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<!-- Network nodes -->
<circle cx="600" cy="120" r="18" stroke="#000" stroke-width="2.5" fill="none"/>
<circle cx="700" cy="180" r="14" stroke="#000" stroke-width="2" fill="none"/>
<circle cx="660" cy="280" r="16" stroke="#000" stroke-width="2.5" fill="none"/>
<circle cx="560" cy="240" r="12" stroke="#000" stroke-width="2" fill="none"/>
<circle cx="580" cy="350" r="14" stroke="#000" stroke-width="2" fill="none"/>
<circle cx="710" cy="350" r="12" stroke="#000" stroke-width="2" fill="none"/>
<!-- Network connections -->
<line x1="615" y1="133" x2="689" y2="170" stroke="#000" stroke-width="1.5"/>
<line x1="596" y1="138" x2="564" y2="230" stroke="#000" stroke-width="1.5"/>
<line x1="690" y1="192" x2="670" y2="267" stroke="#000" stroke-width="1.5"/>
<line x1="570" y1="248" x2="648" y2="270" stroke="#000" stroke-width="1.5"/>
<line x1="555" y1="252" x2="575" y2="338" stroke="#000" stroke-width="1.5"/>
<line x1="672" y1="292" x2="704" y2="341" stroke="#000" stroke-width="1.5"/>
<line x1="593" y1="354" x2="699" y2="352" stroke="#000" stroke-width="1.5"/>
<!-- Node center dots -->
<circle cx="600" cy="120" r="5" fill="#000"/>
<circle cx="700" cy="180" r="4" fill="#000"/>
<circle cx="660" cy="280" r="5" fill="#000"/>
<circle cx="560" cy="240" r="3" fill="#000"/>
<!-- Heart/like icon -->
<path d="M180,330 C180,315 195,305 210,315 C225,305 240,315 240,330 C240,350 210,370 210,370 C210,370 180,350 180,330 Z" stroke="#000" stroke-width="2.5" fill="none"/>
<!-- Share icon -->
<circle cx="310" cy="340" r="8" fill="#000"/>
<circle cx="355" cy="315" r="6" fill="#000"/>
<circle cx="355" cy="365" r="6" fill="#000"/>
<line x1="317" y1="336" x2="350" y2="319" stroke="#000" stroke-width="2"/>
<line x1="317" y1="344" x2="350" y2="361" stroke="#000" stroke-width="2"/>
<!-- Engagement count indicators -->
<rect x="140" y="400" width="60" height="20" rx="10" stroke="#000" stroke-width="1.5" fill="none"/>
<rect x="220" y="400" width="60" height="20" rx="10" stroke="#000" stroke-width="1.5" fill="none"/>
</svg>