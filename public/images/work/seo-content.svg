<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
<rect width="800" height="450" fill="#fff"/>
<pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
<circle cx="10" cy="10" r="0.5" fill="#000" opacity="0.05"/>
</pattern>
<rect width="800" height="450" fill="url(#dots)"/>
<!-- Magnifying glass -->
<circle cx="280" cy="200" r="90" stroke="#000" stroke-width="3" fill="none"/>
<line x1="344" y1="264" x2="400" y2="320" stroke="#000" stroke-width="6" stroke-linecap="round"/>
<!-- Search lines inside glass -->
<line x1="230" y1="175" x2="330" y2="175" stroke="#000" stroke-width="2" stroke-linecap="round"/>
<line x1="230" y1="200" x2="320" y2="200" stroke="#000" stroke-width="2" stroke-linecap="round"/>
<line x1="230" y1="225" x2="300" y2="225" stroke="#000" stroke-width="2" stroke-linecap="round"/>
<!-- Document pages stacked -->
<rect x="480" y="80" width="200" height="260" rx="4" stroke="#000" stroke-width="2.5" fill="#fff"/>
<rect x="495" y="68" width="200" height="260" rx="4" stroke="#000" stroke-width="2" fill="#fff"/>
<rect x="510" y="56" width="200" height="260" rx="4" stroke="#000" stroke-width="2.5" fill="#fff"/>
<!-- Document content lines -->
<line x1="535" y1="90" x2="685" y2="90" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
<line x1="535" y1="115" x2="670" y2="115" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<line x1="535" y1="135" x2="680" y2="135" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<line x1="535" y1="155" x2="650" y2="155" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<line x1="535" y1="180" x2="685" y2="180" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<line x1="535" y1="200" x2="660" y2="200" stroke="#000" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
<!-- Ranking bars at bottom -->
<rect x="160" y="370" width="180" height="8" rx="4" fill="#000"/>
<rect x="160" y="390" width="140" height="8" rx="4" fill="#000" opacity="0.6"/>
<rect x="160" y="410" width="100" height="8" rx="4" fill="#000" opacity="0.3"/>
<!-- Rank numbers -->
<text x="140" y="379" font-family="sans-serif" font-size="12" fill="#000" text-anchor="end" font-weight="bold">1</text>
<text x="140" y="399" font-family="sans-serif" font-size="12" fill="#000" text-anchor="end" font-weight="bold">2</text>
<text x="140" y="419" font-family="sans-serif" font-size="12" fill="#000" text-anchor="end" font-weight="bold">3</text>
<!-- Connecting dots -->
<circle cx="430" cy="180" r="3" fill="#000" opacity="0.3"/>
<circle cx="450" cy="150" r="3" fill="#000" opacity="0.3"/>
<circle cx="445" cy="210" r="3" fill="#000" opacity="0.3"/>
</svg>