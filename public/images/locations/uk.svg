<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="uk-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="9" y="9" width="2" height="2" fill="#000" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff"/>
  <rect width="800" height="600" fill="url(#uk-grid)"/>
  <!-- Bridge structure - Tower Bridge inspired -->
  <!-- Left tower -->
  <rect x="200" y="220" width="50" height="240" fill="#000"/>
  <rect x="195" y="210" width="60" height="16" fill="#000"/>
  <polygon points="210,210 225,170 240,210" fill="#000"/>
  <polygon points="210,170 225,150 240,170" fill="#000"/>
  <!-- Right tower -->
  <rect x="500" y="220" width="50" height="240" fill="#000"/>
  <rect x="495" y="210" width="60" height="16" fill="#000"/>
  <polygon points="510,210 525,170 540,210" fill="#000"/>
  <polygon points="510,170 525,150 540,170" fill="#000"/>
  <!-- Bridge spans -->
  <rect x="250" y="300" width="250" height="12" fill="#000"/>
  <rect x="250" y="340" width="250" height="8" fill="#000"/>
  <!-- Suspension cables -->
  <line x1="225" y1="170" x2="375" y2="290" stroke="#000" stroke-width="3"/>
  <line x1="525" y1="170" x2="375" y2="290" stroke="#000" stroke-width="3"/>
  <!-- Bridge approach left -->
  <rect x="40" y="340" width="160" height="8" fill="#000"/>
  <rect x="60" y="320" width="15" height="28" fill="#000"/>
  <rect x="120" y="320" width="15" height="28" fill="#000"/>
  <!-- Bridge approach right -->
  <rect x="550" y="340" width="210" height="8" fill="#000"/>
  <rect x="600" y="320" width="15" height="28" fill="#000"/>
  <rect x="680" y="320" width="15" height="28" fill="#000"/>
  <!-- City buildings left -->
  <rect x="30" y="260" width="30" height="200" fill="#000"/>
  <rect x="70" y="280" width="25" height="180" fill="#000"/>
  <rect x="105" y="240" width="35" height="220" fill="#000"/>
  <polygon points="105,240 122,220 140,240" fill="#000"/>
  <rect x="150" y="300" width="28" height="160" fill="#000"/>
  <!-- City buildings right -->
  <rect x="580" y="240" width="30" height="220" fill="#000"/>
  <rect x="620" y="200" width="35" height="260" fill="#000"/>
  <rect x="627" y="170" width="21" height="34" fill="#000"/>
  <rect x="665" y="260" width="28" height="200" fill="#000"/>
  <rect x="700" y="280" width="32" height="180" fill="#000"/>
  <rect x="740" y="300" width="30" height="160" fill="#000"/>
  <!-- Shard-like element -->
  <polygon points="635,170 637,100 639,170" fill="#000"/>
  <!-- Tower windows -->
  <g fill="#fff" opacity="0.85">
    <rect x="212" y="240" width="10" height="14"/><rect x="228" y="240" width="10" height="14"/>
    <rect x="212" y="270" width="10" height="14"/><rect x="228" y="270" width="10" height="14"/>
    <rect x="212" y="360" width="10" height="14"/><rect x="228" y="360" width="10" height="14"/>
    <rect x="212" y="400" width="10" height="14"/><rect x="228" y="400" width="10" height="14"/>
    <rect x="512" y="240" width="10" height="14"/><rect x="528" y="240" width="10" height="14"/>
    <rect x="512" y="270" width="10" height="14"/><rect x="528" y="270" width="10" height="14"/>
    <rect x="512" y="360" width="10" height="14"/><rect x="528" y="360" width="10" height="14"/>
    <rect x="512" y="400" width="10" height="14"/><rect x="528" y="400" width="10" height="14"/>
    <rect x="112" y="270" width="7" height="10"/><rect x="126" y="270" width="7" height="10"/>
    <rect x="112" y="320" width="7" height="10"/><rect x="126" y="320" width="7" height="10"/>
    <rect x="112" y="370" width="7" height="10"/><rect x="126" y="370" width="7" height="10"/>
    <rect x="625" y="230" width="8" height="10"/><rect x="640" y="230" width="8" height="10"/>
    <rect x="625" y="280" width="8" height="10"/><rect x="640" y="280" width="8" height="10"/>
    <rect x="625" y="330" width="8" height="10"/><rect x="640" y="330" width="8" height="10"/>
  </g>
  <!-- Water -->
  <rect x="0" y="458" width="800" height="2" fill="#000"/>
  <rect x="0" y="460" width="800" height="140" fill="#000"/>
  <!-- Water ripples -->
  <line x1="50" y1="490" x2="120" y2="490" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="300" y1="500" x2="380" y2="500" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="500" y1="485" x2="560" y2="485" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
  <line x1="650" y1="510" x2="730" y2="510" stroke="#fff" stroke-width="1.5" opacity="0.3"/>
</svg>