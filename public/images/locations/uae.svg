<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="uae-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.6" fill="#000" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff"/>
  <rect width="800" height="600" fill="url(#uae-dots)"/>
  <!-- Desert dunes -->
  <ellipse cx="200" cy="480" rx="250" ry="40" fill="#000" opacity="0.08"/>
  <ellipse cx="600" cy="470" rx="280" ry="35" fill="#000" opacity="0.06"/>
  <!-- Burj Khalifa inspired -->
  <rect x="280" y="60" width="20" height="420" fill="#000"/>
  <polygon points="280,60 290,30 300,60" fill="#000"/>
  <rect x="272" y="120" width="36" height="8" fill="#000"/>
  <rect x="268" y="200" width="44" height="8" fill="#000"/>
  <rect x="264" y="280" width="52" height="8" fill="#000"/>
  <rect x="260" y="360" width="60" height="8" fill="#000"/>
  <!-- Stepped taper -->
  <polygon points="260,480 268,360 312,360 320,480" fill="#000"/>
  <!-- Tower 2 - twisted tower -->
  <rect x="420" y="180" width="35" height="300" fill="#000"/>
  <polygon points="420,180 437,150 455,180" fill="#000"/>
  <rect x="415" y="240" width="45" height="6" fill="#000"/>
  <rect x="415" y="310" width="45" height="6" fill="#000"/>
  <rect x="415" y="380" width="45" height="6" fill="#000"/>
  <!-- Tower 3 - sail shape -->
  <polygon points="560,480 560,200 610,160 610,480" fill="#000"/>
  <polygon points="610,160 620,150 620,480 610,480" fill="#000" opacity="0.6"/>
  <!-- Shorter buildings -->
  <rect x="100" y="340" width="40" height="140" fill="#000"/>
  <rect x="105" y="330" width="30" height="14" fill="#000" rx="6"/>
  <rect x="155" y="380" width="35" height="100" fill="#000"/>
  <rect x="660" y="320" width="38" height="160" fill="#000"/>
  <rect x="660" y="308" width="38" height="16" fill="#000" rx="4"/>
  <rect x="710" y="360" width="30" height="120" fill="#000"/>
  <!-- Arch element -->
  <rect x="490" y="400" width="50" height="80" fill="#000"/>
  <rect x="500" y="390" width="30" height="14" fill="#000" rx="8"/>
  <!-- Windows -->
  <g fill="#fff" opacity="0.85">
    <rect x="286" y="150" width="8" height="10"/>
    <rect x="286" y="220" width="8" height="10"/>
    <rect x="286" y="300" width="8" height="10"/>
    <rect x="286" y="390" width="8" height="10"/>
    <rect x="430" y="210" width="7" height="9"/><rect x="442" y="210" width="7" height="9"/>
    <rect x="430" y="260" width="7" height="9"/><rect x="442" y="260" width="7" height="9"/>
    <rect x="430" y="330" width="7" height="9"/><rect x="442" y="330" width="7" height="9"/>
    <rect x="430" y="400" width="7" height="9"/><rect x="442" y="400" width="7" height="9"/>
    <rect x="572" y="250" width="7" height="9"/><rect x="590" y="250" width="7" height="9"/>
    <rect x="572" y="320" width="7" height="9"/><rect x="590" y="320" width="7" height="9"/>
    <rect x="572" y="390" width="7" height="9"/><rect x="590" y="390" width="7" height="9"/>
    <rect x="110" y="360" width="6" height="8"/><rect x="124" y="360" width="6" height="8"/>
    <rect x="110" y="400" width="6" height="8"/><rect x="124" y="400" width="6" height="8"/>
    <rect x="670" y="345" width="6" height="8"/><rect x="684" y="345" width="6" height="8"/>
    <rect x="670" y="385" width="6" height="8"/><rect x="684" y="385" width="6" height="8"/>
  </g>
  <!-- Ground -->
  <rect x="0" y="478" width="800" height="2" fill="#000"/>
  <rect x="0" y="480" width="800" height="120" fill="#000"/>
</svg>