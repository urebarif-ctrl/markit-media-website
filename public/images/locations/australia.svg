<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="au-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.7" fill="#000" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#fff"/>
  <rect width="800" height="600" fill="url(#au-dots)"/>
  <!-- Opera House inspired sails -->
  <!-- Sail 1 -->
  <polygon points="180,420 180,280 220,200 240,420" fill="#000"/>
  <polygon points="220,200 230,195 240,280 240,420 220,420" fill="#000" opacity="0.7"/>
  <!-- Sail 2 -->
  <polygon points="240,420 240,260 290,180 320,420" fill="#000"/>
  <polygon points="290,180 302,172 320,260 320,420 290,420" fill="#000" opacity="0.7"/>
  <!-- Sail 3 -->
  <polygon points="320,420 320,270 370,195 400,420" fill="#000"/>
  <polygon points="370,195 380,190 400,270 400,420 370,420" fill="#000" opacity="0.7"/>
  <!-- Sail 4 (smaller) -->
  <polygon points="400,420 400,310 430,250 450,420" fill="#000"/>
  <polygon points="430,250 438,246 450,310 450,420 430,420" fill="#000" opacity="0.7"/>
  <!-- Platform base -->
  <rect x="160" y="420" width="310" height="16" fill="#000"/>
  <rect x="150" y="436" width="330" height="8" fill="#000"/>
  <!-- Harbor Bridge inspired arch -->
  <path d="M500,400 Q600,180 760,400" fill="none" stroke="#000" stroke-width="10"/>
  <path d="M500,400 Q600,200 760,400" fill="none" stroke="#000" stroke-width="3"/>
  <!-- Bridge deck -->
  <rect x="500" y="380" width="260" height="8" fill="#000"/>
  <!-- Bridge vertical supports -->
  <rect x="530" y="340" width="4" height="44" fill="#000"/>
  <rect x="560" y="300" width="4" height="84" fill="#000"/>
  <rect x="590" y="270" width="4" height="114" fill="#000"/>
  <rect x="620" y="250" width="4" height="134" fill="#000"/>
  <rect x="650" y="260" width="4" height="124" fill="#000"/>
  <rect x="680" y="280" width="4" height="104" fill="#000"/>
  <rect x="710" y="320" width="4" height="64" fill="#000"/>
  <rect x="740" y="360" width="4" height="24" fill="#000"/>
  <!-- City skyline in background -->
  <rect x="520" y="320" width="22" height="62" fill="#000" opacity="0.3"/>
  <rect x="550" y="300" width="18" height="82" fill="#000" opacity="0.3"/>
  <rect x="576" y="280" width="24" height="102" fill="#000" opacity="0.3"/>
  <rect x="608" y="290" width="20" height="92" fill="#000" opacity="0.3"/>
  <rect x="636" y="310" width="22" height="72" fill="#000" opacity="0.3"/>
  <!-- Left skyline background -->
  <rect x="40" y="340" width="25" height="104" fill="#000" opacity="0.2"/>
  <rect x="75" y="320" width="20" height="124" fill="#000" opacity="0.2"/>
  <rect x="105" y="360" width="22" height="84" fill="#000" opacity="0.2"/>
  <!-- Water -->
  <rect x="0" y="443" width="800" height="2" fill="#000"/>
  <rect x="0" y="445" width="800" height="155" fill="#000"/>
  <!-- Water reflections -->
  <line x1="200" y1="470" x2="350" y2="470" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <line x1="500" y1="480" x2="600" y2="480" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <line x1="120" y1="500" x2="200" y2="500" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <line x1="620" y1="495" x2="720" y2="495" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
  <line x1="350" y1="510" x2="450" y2="510" stroke="#fff" stroke-width="1.5" opacity="0.25"/>
</svg>