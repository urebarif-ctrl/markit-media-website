<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="markit-g" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#FF7A45"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes sweep{0%,100%{transform:translateX(-18px);opacity:.35}50%{transform:translateX(18px);opacity:1}}
    @keyframes twinkle{0%,100%{transform:scale(.78) rotate(0deg);opacity:.65}50%{transform:scale(1.15) rotate(18deg);opacity:1}}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:.95}}
    .sweep{animation:sweep 2.8s ease-in-out infinite}
    .spark{transform-origin:50px 13px;animation:twinkle 2.2s ease-in-out infinite}
    .line{animation:pulse 2.8s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){.sweep,.spark,.line{animation:none}}
  </style>
  <rect width="64" height="64" rx="16" fill="#09090B"/>
  <path d="M15 45V19h7.5L32 31.5 41.5 19H49v26h-7V30.5L32 43 22 30.5V45z" fill="#fff"/>
  <path class="line" d="M14 48.5h36" stroke="url(#markit-g)" stroke-width="3.5" stroke-linecap="round"/>
  <g class="sweep" filter="url(#glow)">
    <circle cx="32" cy="48.5" r="3.2" fill="#8B6CFF"/>
  </g>
  <g class="spark" filter="url(#glow)">
    <path d="M50 5.5 52.3 10l4.9 1-3.5 3.6.6 5-4.3-2.1-4.3 2.1.6-5-3.5-3.6 4.9-1z" fill="url(#markit-g)"/>
  </g>
</svg>