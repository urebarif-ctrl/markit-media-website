<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<style>
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.72);opacity:.68}}
@keyframes orbit{to{transform:rotate(360deg)}}
.core{transform-origin:32px 32px;animation:pulse 2.4s ease-in-out infinite}
.orbit{transform-origin:32px 32px;animation:orbit 5s linear infinite}
@media(prefers-reduced-motion:reduce){.core,.orbit{animation:none}}
</style>
<rect width="64" height="64" rx="16" fill="#0B0B0D"/>
<path d="M17 43V21h7l8 11 8-11h7v22h-7V31l-8 10-8-10v12z" fill="#fff"/>
<g class="orbit"><circle cx="50" cy="15" r="4" fill="#FF7A45"/><circle cx="14" cy="49" r="3" fill="#8B6CFF"/></g>
<circle class="core" cx="32" cy="32" r="3.2" fill="#8B6CFF"/>
</svg>