<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    @keyframes breathe {
      0%,100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.78); opacity: .72; }
    }
    @keyframes orbit {
      to { transform: rotate(360deg); }
    }
    @keyframes glow {
      0%,100% { opacity: .35; }
      50% { opacity: .8; }
    }
    .core { transform-origin: 32px 32px; animation: breathe 2.4s ease-in-out infinite; }
    .orbit { transform-origin: 32px 32px; animation: orbit 5.5s linear infinite; }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .core,.orbit,.glow { animation: none; }
    }
  </style>
  <rect width="64" height="64" rx="16" fill="#0B0B0D"/>
  <circle class="glow" cx="32" cy="32" r="25" fill="none" stroke="#8B6CFF" stroke-width="1.5"/>
  <path d="M15 45V19h8l9 12 9-12h8v26h-8V30.5L32 42 23 30.5V45z" fill="#fff"/>
  <g class="orbit">
    <circle cx="51" cy="14" r="4.2" fill="#FF7A45"/>
    <circle cx="13" cy="50" r="3.2" fill="#8B6CFF"/>
  </g>
  <circle class="core" cx="32" cy="32" r="3.4" fill="#8B6CFF"/>
</svg>