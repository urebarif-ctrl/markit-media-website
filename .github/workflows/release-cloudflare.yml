name: Release to Cloudflare (manual, approval-gated)

# Never runs on push or pull_request. A person must start it from the Actions tab,
# type DEPLOY, and a required reviewer must approve the "production" environment.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to release (branch, tag or full SHA). Default: main"
        required: true
        default: main
      confirm:
        description: "Type DEPLOY to confirm a production release"
        required: true

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit confirmation
        if: ${{ github.event.inputs.confirm != 'DEPLOY' }}
        run: |
          echo "Confirmation text must be exactly DEPLOY."
          exit 1

  build:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 1

      - name: Record commit
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Build with OpenNext for Cloudflare
        run: npx opennextjs-cloudflare build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
          # Build-time placeholders only; real secrets live in Cloudflare Worker secrets.
          MONGODB_URI: mongodb://localhost:27017/markit-build-only
          JWT_SECRET: build-only-secret-not-used-at-runtime

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: open-next-${{ steps.rev.outputs.sha }}
          path: |
            .open-next
            wrangler.jsonc
          # .open-next is a dot-folder: upload-artifact@v4 skips hidden files unless told otherwise.
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure "Required reviewers" on this environment in
    # Settings > Environments > production. Secrets live on the environment.
    environment: production
    steps:
      - name: Checkout same commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install wrangler from lockfile
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: open-next-${{ needs.build.outputs.sha }}
          path: .

      - name: Capture currently deployed version (for rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list --name markit-media | tee previous-deployment.txt

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --var GIT_SHA:${{ needs.build.outputs.sha }}

      - name: Smoke test production
        run: |
          set -e
          for path in /en /en/contact /en/services /sitemap-index.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "release-smoke-test" "https://themarkitmedia.com${path}")
            echo "${path} -> ${code}"
            [ "$code" = "200" ]
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "release-smoke-test" "https://themarkitmedia.com/en/blog/this-slug-does-not-exist-smoke")
          echo "missing blog slug -> ${code}"
          [ "$code" = "404" ]

      - name: Keep deployment record
        uses: actions/upload-artifact@v4
        with:
          name: deployment-record-${{ needs.build.outputs.sha }}
          path: previous-deployment.txt
          retention-days: 90
